name: First Workflow
on: workflow_dispatch
jobs:
    first-job:
        runs-on: ubuntu-latest
        steps:
            - name: Print Hello World
              run: echo "Hello World"
            - name: Print System Information
              run: |
                echo "Operating System: $(uname -s)"
                echo "Kernel Version: $(uname -r)"
                echo "Architecture: $(uname -m)"
            - name: Print goodbye
              run: echo "Goodbye"